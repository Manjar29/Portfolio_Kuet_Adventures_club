<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Registrations - KUET Adventure Club</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="p29.css">
	<style>
		.registrations-table-wrap {
			overflow-x: auto;
		}
		.registrations-table {
			width: 100%;
			border-collapse: collapse;
			background: rgba(255, 255, 255, 0.92);
			border-radius: 18px;
			overflow: hidden;
		}
		.registrations-table th,
		.registrations-table td {
			padding: 0.9rem 1rem;
			text-align: left;
			border-bottom: 1px solid rgba(15, 23, 42, 0.08);
			vertical-align: top;
		}
		.registrations-table .actions-cell {
			white-space: nowrap;
		}
		.registrations-table th {
			background: #102a43;
			color: #fff;
			font-weight: 600;
			white-space: nowrap;
		}
		.registrations-table tbody tr:nth-child(even) {
			background: rgba(15, 23, 42, 0.03);
		}
		.registrations-status {
			margin: 0 0 1rem;
			font-weight: 500;
		}
		.admin-toolbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 1rem;
			flex-wrap: wrap;
			margin-bottom: 1rem;
		}
		.logout-link {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 0.7rem 1rem;
			border-radius: 999px;
			text-decoration: none;
			font-weight: 600;
			background: #102a43;
			color: #fff;
		}
		.row-action {
			border: 0;
			border-radius: 999px;
			padding: 0.5rem 0.85rem;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
			margin-right: 0.35rem;
		}
		.row-action.view {
			background: #dbeafe;
			color: #1d4ed8;
		}
		.row-action.delete {
			background: #fee2e2;
			color: #b91c1c;
		}
	</style>
</head>
<body class="membership-page">
	<header class="page-hero">
		<div class="container page-hero-inner">
			<a href="admin.html" class="back-link">Back to admin panel</a>
			<p class="eyebrow">Admin</p>
			<h1>Submitted Registrations</h1>
			<p>Live membership requests loaded from the ASP.NET API.</p>
		</div>
	</header>

	<main class="container form-page-wrap">
		<section class="membership-form form-page-form">
				<div class="admin-toolbar">
					<p class="form-status registrations-status" id="authStatus" aria-live="polite">Checking admin access...</p>
					<a class="logout-link" href="#" id="logoutLink">Logout</a>
				</div>
			<p class="form-status registrations-status" id="registrationsStatus" aria-live="polite">Loading registrations...</p>
			<div class="registrations-table-wrap">
				<table class="registrations-table" aria-label="Membership registrations">
					<thead>
						<tr>
							<th>ID</th>
							<th>Name</th>
							<th>Type</th>
							<th>Department</th>
							<th>Roll / ID</th>
							<th>Batch</th>
							<th>Mailbox</th>
							<th>Phone</th>
							<th>Passport</th>
							<th>Status</th>
							<th>Member ID</th>
							<th>Submitted</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody id="registrationsBody"></tbody>
				</table>
			</div>
		</section>
	</main>

	<script src="admin-auth.js?v=20260609a"></script>
	<script src="api-client.js?v=20260523c"></script>
	<script src="copy-protect.js?v=20260523a"></script>
	<script>
		(function () {
			var authStatus = document.getElementById("authStatus");
			var status = document.getElementById("registrationsStatus");
			var body = document.getElementById("registrationsBody");
			var logoutLink = document.getElementById("logoutLink");
			var apiPath = "/api/memberships";

			if (window.KUET_ADMIN_AUTH && !window.KUET_ADMIN_AUTH.requireAuth("admin-registrations.html")) {
				return;
			}

			authStatus.textContent = "Admin access granted.";
			logoutLink.addEventListener("click", function (event) {
				event.preventDefault();
				if (window.KUET_ADMIN_AUTH) {
					window.KUET_ADMIN_AUTH.clearAuthentication();
				}
				window.location.href = "AdminLogin.html";
			});

			function escapeHtml(value) {
				return String(value)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/\"/g, "&quot;")
					.replace(/'/g, "&#39;");
			}

			function getRowDetails(row) {
				return [
					"Name: " + row.fullName,
					"Type: " + row.memberType,
					"Department: " + row.department,
					"Roll / ID: " + row.rollId,
					"Batch: " + row.batch,
					"Mailbox: " + row.mailbox,
					"Phone: " + row.phoneNumber,
					"Passport: " + (row.hasPassport ? "Yes" : "No"),
					"Status: " + (row.reviewStatus || "Pending"),
					"Member ID: " + (row.clubMemberId || "-"),
					"Submitted: " + (row.submittedAtUtc || ""),
					"Reviewed: " + (row.reviewedAtUtc || ""),
					"Message: " + (row.message || "")
				].join("\n");
			}

			function loadRows() {
				// Show which API hosts will be tried (helpful when debugging network issues)
				try {
					var candidates = window.KUET_API.getApiBaseCandidates();
					status.textContent = "Attempting: " + (Array.isArray(candidates) ? candidates.join(", ") : candidates);
				} catch (e) {
					// ignore if client helper not available
				}

				window.KUET_API.requestJson(apiPath)
					.then(function (rows) {
						if (!Array.isArray(rows) || rows.length === 0) {
							status.textContent = "No registrations found yet.";
							body.innerHTML = "";
							return;
						}

						status.textContent = "Loaded " + rows.length + " registration(s).";
						body.innerHTML = rows.map(function (row) {
							return "<tr>" +
								"<td>" + escapeHtml(row.id) + "</td>" +
								"<td>" + escapeHtml(row.fullName) + "</td>" +
								"<td>" + escapeHtml(row.memberType) + "</td>" +
								"<td>" + escapeHtml(row.department) + "</td>" +
								"<td>" + escapeHtml(row.rollId) + "</td>" +
								"<td>" + escapeHtml(row.batch) + "</td>" +
								"<td>" + escapeHtml(row.mailbox) + "</td>" +
								"<td>" + escapeHtml(row.phoneNumber) + "</td>" +
								"<td>" + (row.hasPassport ? "Yes" : "No") + "</td>" +
								"<td>" + escapeHtml(row.reviewStatus || "Pending") + "</td>" +
								"<td>" + escapeHtml(row.clubMemberId || "-") + "</td>" +
								"<td>" + escapeHtml(row.submittedAtUtc || "") + "</td>" +
								"<td class='actions-cell'>" +
									"<button type='button' class='row-action view' data-action='view' data-id='" + escapeHtml(row.id) + "'>View</button>" +
									"<button type='button' class='row-action accept' data-action='accept' data-id='" + escapeHtml(row.id) + "'>Accept</button>" +
									"<button type='button' class='row-action delete' data-action='delete' data-id='" + escapeHtml(row.id) + "'>Delete</button>" +
								"</td>" +
								"</tr>";
						}).join("");
					})
					.catch(function (error) {
						status.textContent = "Unable to load registrations: " + (error && error.message ? error.message : error);
						body.innerHTML = "";
					});
			}

			body.addEventListener("click", function (event) {
				var button = event.target.closest("button[data-action]");
				if (!button) {
					return;
				}

				var id = button.getAttribute("data-id");
				var action = button.getAttribute("data-action");
				var row = button.closest("tr");

				if (action === "view") {
					window.KUET_API.requestJson(apiPath + "/" + encodeURIComponent(id))
						.then(function (data) {
							window.alert(getRowDetails(data));
						})
						.catch(function (error) {
							status.textContent = "Unable to load registration details: " + error.message;
						});
					return;
				}

				if (action === "accept") {
					var suggestedId = "KAC-" + String(id).padStart(4, "0");
					var clubMemberId = window.prompt("Enter club member ID to assign, or leave blank for auto-generate:", suggestedId);
					if (clubMemberId === null) {
						return;
					}

					window.KUET_API.requestApi(apiPath + "/" + encodeURIComponent(id) + "/accept", {
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify({ clubMemberId: clubMemberId.trim() })
					})
						.then(function (response) {
							if (response.status !== 200) {
								throw new Error("Accept failed.");
							}
							loadRows();
						})
						.catch(function (error) {
							status.textContent = "Unable to accept registration: " + (error && error.message ? error.message : error);
						});
					return;
				}

				if (action === "delete") {
					if (!window.confirm("Delete registration #" + id + "? This cannot be undone.")) {
						return;
					}

					window.KUET_API.requestApi(apiPath + "/" + encodeURIComponent(id), { method: "DELETE" })
						.then(function (response) {
							if (response.status !== 204) {
								throw new Error("Delete failed.");
							}
							loadRows();
						})
						.catch(function (error) {
							status.textContent = "Unable to delete registration: " + error.message;
						});
				}
			});

			loadRows();
		})();
	</script>
</body>
</html>
